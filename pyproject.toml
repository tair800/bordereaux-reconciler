[project]
name = "bordereaux-reconciler"
version = "0.1.0"
description = "Reconcile delegated-authority bordereaux against a carrier ledger, deterministically and with cell-level lineage."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "rapidfuzz>=3.10",
  # A runtime dependency, not a dev one. `ingest/read.py` imports it to read XLSX, and while it sat
  # in the dev group the shipped image could not open a spreadsheet at all — the corpus has XLSX
  # variants, so this was not a hypothetical gap. Caught by listing what the built image actually
  # contains rather than by reading the file that declares it.
  "openpyxl>=3.1",
]

# `polars` and `python-multipart` were declared here and imported nowhere. Polars alone is most of
# a hundred megabytes in the image, and a dependency nothing uses is still one somebody has to patch
# when it has a CVE. `httpx` moved to the dev group: Starlette's TestClient needs it, and the
# service does not — which the test run said immediately when it was removed outright.

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-openpyxl>=3.1",
  # Required by starlette.testclient. Test-only: nothing the service runs makes an HTTP request.
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bordereaux_reconciler"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "S", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
# N802: the kill tests are named for the conditions ADR-001 fixed, A-H. Lowercasing them would
# disconnect each test from the criterion it exists to enforce.
"tests/*" = ["S101", "PLR2004", "N802"]
"scripts/*" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "postgres: needs a real PostgreSQL, run by the evidence lane rather than the fast lane",
  "live_model: reaches a model provider and needs a key",
]
