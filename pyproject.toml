[project]
name = "bordereaux-reconciler"
version = "0.1.0"
description = "Reconcile delegated-authority bordereaux against a carrier ledger, deterministically and with cell-level lineage."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "polars>=1.17",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "rapidfuzz>=3.10",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
  "playwright>=1.49",
  "openpyxl>=3.1",
  "types-openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bordereaux_reconciler"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "S", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
# N802: the kill tests are named for the conditions ADR-001 fixed, A-H. Lowercasing them would
# disconnect each test from the criterion it exists to enforce.
"tests/*" = ["S101", "PLR2004", "N802"]
"scripts/*" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "postgres: needs a real PostgreSQL, run by the evidence lane rather than the fast lane",
  "live_model: reaches a model provider and needs a key",
]
