# Two lanes, and the split is deliberate.
#
# `fast` is what a pull request waits on: lint, types, and every test that needs no infrastructure.
# It finishes in about a minute, which is the difference between a check people read and one they
# learn to ignore.
#
# `evidence` regenerates the whole corpus, rebuilds all eight artifacts against a real PostgreSQL,
# and grades them with the kill test that was committed before any implementation existed. It is
# slower and it is the one that decides whether the project's claims are still true, so it is
# **required** rather than advisory, and it runs on every push to main and every pull request.
#
# `falsifiability` plants nineteen defects and checks the suite catches each. It is the slowest
# lane by a distance, so it runs on main and on a schedule rather than on every push — but it is
# never `continue-on-error`. A lane allowed to fail silently is a lane that is already failing.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so the falsifiability lane runs even on a quiet week.
    - cron: "17 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # A value only CI uses. Not a secret, not shared with anything, and not a credential for anything
  # that exists outside this job's network namespace.
  BX_DATABASE_URL: postgresql+psycopg://bordereaux:ci_only_not_a_secret@localhost:5432/bordereaux

jobs:
  fast:
    name: lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Format check
        run: uv run ruff format --check src tests scripts

      - name: Types
        run: uv run mypy src

      - name: Tests that need no infrastructure
        # The store and console tests skip without a database; everything else is real coverage.
        run: uv run pytest tests -q --ignore=tests/test_kill_criteria.py

      - name: Residency manifests are current
        # Cheap, and it is the drift that actually happens: a region edited in the tfvars and the
        # committed manifest not regenerated. Kill condition H catches it too, in the slow lane;
        # this catches it in thirty seconds.
        run: uv run python scripts/residency_manifest.py --check

  terraform:
    name: terraform validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"

      - name: Format
        run: terraform fmt -recursive -check infra

      - name: Validate every environment root
        # `-backend=false`: there is no state, nothing has been applied, and no credentials exist.
        # What this proves is that the configuration parses and type-checks against the real
        # provider schema. It does not prove anything is deployed, and the README says so.
        run: |
          for env in bench dev prod; do
            echo "::group::$env"
            terraform -chdir=infra/terraform/envs/$env init -backend=false -input=false
            terraform -chdir=infra/terraform/envs/$env validate
            echo "::endgroup::"
          done

  evidence:
    name: corpus, artifacts, kill criteria
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bordereaux
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: bordereaux
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bordereaux -d bordereaux"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Generate the corpus
        # Rebuilt from a committed seed rather than kept in git. A corpus in history is a corpus
        # nobody regenerates, and then the seed stops being the source of truth.
        run: uv run python scripts/generate_corpus.py

      - name: Prove the corpus is reproducible
        # Two full builds, diffed byte for byte. This is kill condition A's first half, and it is
        # cheap enough to run here rather than trusting the artifact that reports it.
        run: uv run python scripts/generate_corpus.py --verify-determinism

      - name: Migrate the schema
        # Through the Alembic CLI, which is what an operator runs. `build_artifacts.py` would create
        # the tables itself, so running this first is what makes the migrations exercised rather
        # than merely committed.
        run: uv run alembic upgrade head

      - name: Build the evidence
        run: uv run python scripts/build_artifacts.py

      - name: Grade it against the predeclared thresholds
        # `test_kill_criteria.py` has not been edited since it was committed before any
        # implementation existed, and `test_predeclaration.py` fails the build if anything in it
        # learns to skip.
        run: uv run pytest tests/test_kill_criteria.py tests/test_predeclaration.py -q

      - name: Full suite against a real database
        run: uv run pytest tests -q

      - name: The committed evidence must still be true
        # `artifacts/` is committed because it is what the README cites and what a reader browsing
        # the repository sees. That only stays honest if it is current, and "somebody will remember
        # to rebuild it" is not a mechanism. The comparison excludes `provenance` — commit, OS and
        # Python patch version legitimately differ between a laptop and a runner — and compares
        # every measured number.
        run: uv run python scripts/check_artifacts_current.py

      - name: Publish the artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: artifacts/
          retention-days: 30

  falsifiability:
    name: planted breaches
    # Only where it is worth the minutes. Never `continue-on-error`: a lane allowed to fail
    # silently is a lane that is already failing.
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bordereaux
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: bordereaux
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bordereaux -d bordereaux"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Generate the corpus
        run: uv run python scripts/generate_corpus.py

      - name: Build the evidence
        # Needed because three breaches are graded by the kill test, which reads the artifacts.
        run: uv run python scripts/build_artifacts.py

      - name: Plant every breach and check each is caught
        run: uv run python scripts/plant_breaches.py

      - name: No planted breach survived
        # Scoped to the paths a breach can be planted in, rather than the whole tree. The previous
        # step rebuilds `artifacts/`, whose provenance block records the commit and the runner's OS,
        # so an unscoped `git diff` failed on build output and said nothing about whether a breach
        # had survived. A check that fires for the wrong reason is worse than no check: it gets
        # muted, and then the right reason goes unnoticed too.
        run: git diff --exit-code -- src tests scripts infra alembic

  docker:
    name: image builds and serves
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t bordereaux-reconciler:ci .

      - name: It starts and answers, without a database
        # The console needs a database; `/healthz` is expected to report `degraded` without one and
        # still answer. A container that hung or crashed here would pass a "does it build" check
        # and fail the first time anybody deployed it.
        run: |
          docker run -d --name bx -p 8000:8000 -e BX_ENVIRONMENT=ci bordereaux-reconciler:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/healthz || true)
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then
              echo "healthz answered $code"
              exit 0
            fi
            sleep 2
          done
          echo "the container never answered"
          docker logs bx
          exit 1
