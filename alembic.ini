# Alembic owns the schema for anything long-lived. `store.create_all()` exists for tests and the
# evidence lane, and `tests/test_migrations.py` builds a database each way and compares the two
# shapes — a comment promising they agree would not survive the first schema change.
#
# The URL is deliberately absent. `alembic/env.py` reads `BX_DATABASE_URL`, so there is no
# connection string in a committed file and no chance of a migration running against whatever
# happened to be written here.

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
